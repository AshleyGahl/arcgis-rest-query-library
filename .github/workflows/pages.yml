# Publishes the repository root to GitHub Pages.
#
# There is no build step: the site is the repository. `index.html` is the landing
# page, `viewer/` is the app, `sw.js` must stay at the root (a service worker can
# only intercept URLs inside its own scope), and `server/`, `sql-library/` and
# `data/` are fetched by the viewer as ES modules and data at runtime.
#
# Requires Settings > Pages > Source = "GitHub Actions" (set once, by hand: the
# Actions token is not permitted to enable Pages on a repository that has never
# had it on), and Settings > Actions > General > Workflow permissions allowing
# `pages: write`, which the Deploy step needs.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish rather than cancelling it part-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      # Stage only what the site serves. Uploading the repository root would also
      # ship .git and the Node-only parts, which the browser never asks for.
      - name: Stage the site
        run: |
          mkdir -p _site
          cp index.html .nojekyll sw.js _site/
          cp -r viewer sql-library data docs _site/
          # The MCP tab imports the tool contract itself; mcp/server.js stays behind (Node only).
          mkdir -p _site/mcp
          cp mcp/tools.js _site/mcp/
          # The viewer imports the engine itself; these are the platform-free modules.
          mkdir -p _site/server
          cp server/featureService.js server/restRouter.js server/schema.js \
             server/catalogSchema.js server/serviceConfig.js server/sqlDialect.js _site/server/
          echo "staged $(find _site -type f | wc -l) files, $(du -sh _site | cut -f1)"

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      # `deploy-pages` asks the Actions API for the artifact the previous step just
      # uploaded, and intermittently is told it does not exist yet ("Found 0
      # artifact(s)") — the artifact index is eventually consistent. That is a coin
      # flip, not a problem with the site, so take the failure and try once more.
      - name: Deploy
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait for the artifact to be visible
        if: steps.deployment.outcome == 'failure'
        run: |
          echo "::warning::Pages deploy failed on the first attempt; retrying after a pause."
          sleep 20

      - name: Deploy (retry)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
